name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: busyness_owner
          POSTGRES_PASSWORD: owner_dev_password
          POSTGRES_DB: busyness_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U busyness_owner -d busyness_test"
          --health-interval 2s --health-retries 30
      mail:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create restricted app role
        run: psql "postgres://busyness_owner:owner_dev_password@localhost:5433/busyness_test" -c "CREATE ROLE busyness_app LOGIN PASSWORD 'app_dev_password'"
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and integration tests (real Postgres)
        run: npm test
      - name: Known vulnerabilities in shipped dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (real browser)
        run: npm run test:e2e
      - run: npm run build
