name: Nightly backup

# Encrypted backup of the Neon database and the R2 documents into a restic repository on
# Backblaze B2 (EU). GitHub emails you if this fails. Secrets: see README "Backups".
on:
  schedule:
    - cron: "17 1 * * *" # 01:17 UTC = 02:17/03:17 Norwegian time
  workflow_dispatch:

concurrency: backup

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pg_dump, restic, rclone
        env:
          PG_MAJOR: ${{ vars.PG_MAJOR || '17' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common rclone restic
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq "postgresql-client-$PG_MAJOR"
          sudo restic self-update
      - name: Back up
        run: bash scripts/backup/backup.sh
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          FILES_RCLONE_SOURCE: r2:${{ secrets.R2_BUCKET }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
